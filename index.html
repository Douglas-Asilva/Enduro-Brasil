<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Enduro Remaster — Edição Brasileira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, 133.333vh);
    height: min(75vw, 100vh);
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Botões de toque (só aparecem no celular, durante a corrida). Ficam sobre o jogo, mas quem lê
     os toques é o game.js, que testa a posição de cada botão — por isso pointer-events: none. */
  #touchui {
    --b: clamp(64px, 22vmin, 116px);
    display: none; position: fixed; inset: 0; pointer-events: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #touchui.on { display: block; }
  #touchui .tbtn {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom));
    width: var(--b); height: var(--b); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.5);
    color: #fff; font: 700 clamp(12px, 3.6vmin, 18px)/1 sans-serif; letter-spacing: .04em;
  }
  #touchui .tbtn.down { background: rgba(255,210,74,.55); border-color: #ffd24a; }
  #touchui .arrow { width: 42%; height: 42%; background: #fff; }
  #touchui #tl { left: max(14px, env(safe-area-inset-left)); }
  #touchui #tr { left: calc(max(14px, env(safe-area-inset-left)) + var(--b) + 14px); }
  #touchui #tl .arrow { clip-path: polygon(100% 0, 100% 100%, 0 50%); }
  #touchui #tr .arrow { clip-path: polygon(0 0, 100% 50%, 0 100%); }
  #touchui #tb {
    right: max(14px, env(safe-area-inset-right)); width: calc(var(--b) * 1.55);
    border-radius: calc(var(--b) / 2); background: rgba(224,48,48,.28); border-color: rgba(255,120,120,.7);
  }
  #touchui #tb.down { background: rgba(224,48,48,.75); border-color: #ff9090; }
  #touchui #tp {
    bottom: auto; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    width: 46px; height: 46px; border-radius: 12px; background: rgba(0,0,0,.35); border-width: 2px;
  }
  #touchui #tp i { width: 5px; height: 18px; background: #fff; margin: 0 3px; }
</style>
</head>
<body>
<canvas id="game" width="320" height="240"></canvas>
<div id="touchui">
  <div class="tbtn" id="tl"><span class="arrow"></span></div>
  <div class="tbtn" id="tr"><span class="arrow"></span></div>
  <div class="tbtn" id="tb">FREAR</div>
  <div class="tbtn" id="tp"><i></i><i></i></div>
</div>
<script src="src/sprites.js"></script>
<script src="src/audio.js"></script>
<script src="src/gamepad.js"></script>
<script src="src/game.js"></script>
</body>
</html>
