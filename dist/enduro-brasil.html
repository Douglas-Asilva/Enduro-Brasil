  fusca: {
    half: [
      '......DDBB',
      '....DBBBBB',
      '...DBBWWWW',
      '...DBWwWWW',
      '..DBBBWWWW',
      '..DBBBBBBB',
      '..DBBBBBBL',
      '..DBBBKBKB',
      'rRDBBBKBKB',
      'RRDBBBBBBB',
      'DDDBBBBBPP',
      'DDDDBBBBPP',
      'CCCCCCCCCC',
      '.TTT......',
      '.TTT......',
    ],
  },
  kombi: {
    half: [
      '..SSSSSSSS',
      '.SSSSSSSSS',
      '.SWWWWWWWW',
      '.SWwWWWWWW',
      '.SWWWWWWWW',
      '.SWWWWWWWW',
      '.SSSSSSSSS',
      '.SSSSSSSSS',
      '.BBBBBBBBB',
      '.BBBBBBBBB',
      'RBBKKKKKKK',
      'RBBKBBBBBB',
      'rBBKBBBBPP',
      '.BBKKKKKKK',
      '.DDDDDDDDD',
      'CCCCCCCCCC',
      '.TT.......',
      '.TT.......',
    ],
  },
  // Uno: hatch quadradinho, vidro traseiro grande e quase vertical, lanternas verticais nos cantos
  uno: {
    half: [
      '...DDBBBBB',
      '..DBBBBBBB',
      '..DWWWWWWW',
      '..DWwWWWWW',
      '..DWWWWWWW',
      '..DWWWWWWW',
      '.DBBBBBBBB',
      'RRBBBBBBBB',
      'RrBBBBBBBB',
      'RrBBBBBBPP',
      'RRBBBBBBPP',
      'DDDDDDDDDD',
      'GGGGGGGGGG',
      '.TTT......',
      '.TTT......',
    ],
  },
  brasilia: {
    half: [
      '.....DDBBBB',
      '....DBBBBBB',
      '...DWWWWWWW',
      '..DWwWWWWWW',
      '..DWWWWWWWW',
      '.DBBBBBBBBB',
      'DBBBBBBBBBB',
      'RRRrBBBBBBB',
      'RRRrBBBBBPP',
      'DBBBBBBBBPP',
      'CCCCCCCCCCC',
      '.TTT.......',
      '.TTT.......',
    ],
  },
};

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
// Cache dos textos de cor: o render pede centenas por quadro e quase sempre repete cores
const rgbCache = new Map();
function rgbStr(c) {
  const k = ((c[0] | 0) << 16) | ((c[1] | 0) << 8) | (c[2] | 0);
  let s = rgbCache.get(k);
  if (s === undefined) {
    if (rgbCache.size > 8192) rgbCache.clear();
    s = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
    rgbCache.set(k, s);
  }
  return s;
}
function mulRgb(c, f) { return c.map(v => Math.min(255, v * f)); }
function tintRgb(c, f) { return c.map(v => v + (255 - v) * f); }
function lerpRgb(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }

const spriteCache = new Map();

function getSprite(model, color, mode = 'normal') {
  const key = `${model}|${color}|${mode}`;
  let s = spriteCache.get(key);
  if (!s) {
    s = buildSprite(model, color, mode);
    spriteCache.set(key, s);
  }
  return s;
}

function buildSprite(model, color, mode) {
  const half = MODELS[model].half;
  const hw = Math.max(...half.map(r => r.length));
  const rows = half.map(r => {
    const left = r.padStart(hw, '.');
    return left + left.split('').reverse().join('');
  });
  const cv = document.createElement('canvas');
  cv.width = hw * 2;
  cv.height = rows.length;
  const g = cv.getContext('2d');

  if (mode === 'snowcap' || mode === 'rim') {
    // Contorno superior: neve acumulada (branca) ou luz de contraluz (dourada)
    g.fillStyle = mode === 'rim' ? 'rgb(255,196,110)' : 'rgb(246,249,255)';
    for (let x = 0; x < cv.width; x++) {
      let y = 0;
      while (y < rows.length && rows[y][x] === '.') y++;
      if (y >= rows.length || rows[y][x] === 'T') continue;
      g.fillRect(x, y, 1, 1);
      if (y < 3 && y + 1 < rows.length && 'BDLS'.includes(rows[y + 1][x])) g.fillRect(x, y + 1, 1, 1);
    }
    cv.lights = [];
    return cv;
  }

  const body = hexToRgb(color);
  const pal = {
    B: body, D: mulRgb(body, 0.65), L: tintRgb(body, 0.35), K: mulRgb(body, 0.4),
    S: [236, 236, 230], W: [27, 39, 51], w: [109, 143, 176], T: [17, 17, 17],
    C: [189, 189, 189], G: [58, 58, 62], P: [230, 207, 58], R: [255, 43, 43], r: [176, 24, 24],
  };

  let lx = 0, ly = 0, ln = 0;
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < rows[y].length; x++) {
      const ch = rows[y][x];
      let c = pal[ch];
      if (!c) continue;
      const isLight = ch === 'R' || ch === 'r';
      if (isLight && x < hw) { lx += x + 0.5; ly += y + 0.5; ln++; }
      if (mode === 'lights') {
        if (!isLight) continue;
        c = [255, 59, 59];
      } else if (mode === 'solid') {
        c = body;                   // silhueta chapada na cor dada (ex.: neblina)
      } else if (mode === 'night' && !isLight) {
        c = mulRgb(c, 0.22);
      }
      g.fillStyle = rgbStr(c);
      g.fillRect(x, y, 1, 1);
    }
  }
  // Centro das lanternas (esquerda e direita), em pixels do sprite
  lx /= ln; ly /= ln;
  cv.lights = [[lx, ly], [cv.width - lx, ly]];
  return cv;
}

/* ================= Objetos da beira da estrada =================
   Mesma ideia dos carros: `half` é espelhado (objetos simétricos); `rows` é a imagem inteira.
   anchor: coluna (em pixels) que toca o chão na posição do objeto; size: escala extra. */
const PROP_PAL = {
  G: [52, 128, 56], H: [30, 88, 38], E: [110, 180, 100],            // folhagem
  N: [110, 76, 50], M: [76, 50, 34],                                 // tronco / madeira
  Q: [70, 72, 80], P: [140, 142, 150],                               // poste
  L: [230, 230, 210],                                                // lâmpada (acesa à noite)
  V: [235, 235, 235], S: [0, 112, 60], W: [250, 250, 250],           // placa verde / branco
  K: [40, 40, 46], R: [200, 50, 40], Y: [245, 200, 40],              // outdoor / telhado
  B: [150, 156, 170], D: [96, 102, 116], J: [120, 150, 180], O: [70, 88, 108], // prédio: parede, aresta, vidro, vidro escuro
  // Casas do morro: fachadas coloridas, tijolo aparente e caixa d'água azul
  a: [232, 122, 58], b: [236, 132, 164], c: [246, 206, 82], d: [112, 172, 222], e: [124, 192, 122],
  f: [168, 88, 58], F: [132, 66, 44], x: [38, 108, 192],
};
const PROP_NIGHT_LIGHT = { L: [255, 236, 160], J: [255, 214, 120] };   // o que acende à noite

const TREE_HALF = [
  '.....HHH', '...HHGGG', '..HGGGEG', '.HGGGEEG', '.HGGGGGG', 'HGGGGGGE', 'HGGEGGGG', 'HGGGGGGG',
  'HHGGGGGG', '.HGGGGEG', '.HHGGGGG', '..HHHGGG', '....HHHH', '......MN', '......MN', '......MN',
  '......MN', '.....MMN',
];
const BILLBOARD_ROWS = [
  'KKKKKKKKKKKKKKKKKKKKKKKK',
  'KRRRRRRRRRRRRRRRRRRRRRRK',
  'KRYYYYYRRRRRRRWWWWWWWRRK',
  'KRYYYYYRRRWWRRWRRRRRWRRK',
  'KRYYYYYRRRWWRRWWWWWWWRRK',
  'KRRRRRRRRRRRRRRRRRRRRRRK',
  'KRWWWWWWWWWWWWWWWWWWWWRK',
  'KRRRRRRRRRRRRRRRRRRRRRRK',
  'KKKKKKKKKKKKKKKKKKKKKKKK',
  ...Array(8).fill('....QP............QP....'),
];

// Prédio com grade de janelas (algumas acesas à noite)
function makeBuilding(w, h, seed) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let r = '';
    for (let x = 0; x < w; x++) {
      if (x === 0 || x === w - 1 || y === 0) r += 'D';
      else if (y >= 2 && y < h - 2 && x % 3 !== 0 && (y - 2) % 4 < 2) {
        const s = Math.sin(x * 12.9898 + y * 78.233 + seed * 37.7) * 43758.5453;
        r += s - Math.floor(s) < 0.4 ? 'J' : 'O';
      } else r += 'B';
    }
    rows.push(r);
  }
  return rows;
}

// Casas empilhadas de morro: 2 a 4 andares de larguras e cores diferentes, com laje,
// janelas (acesas à noite), porta no térreo e caixa d'água azul em cima
function makeHillHouses(seed) {
  let s = seed;
  const rnd = n => { s = (s * 9301 + 49297) % 233280; return s % n; };
  const WIDTH = 24, floors = [];
  const n = 2 + rnd(3);
  for (let i = 0; i < n; i++) {
    const w = 12 + rnd(WIDTH - 11);
    floors.push({ w, o: rnd(WIDTH - w + 1), wall: 'abcdeff'[rnd(7)] });   // tijolo aparente aparece mais
  }
  const rows = [];
  floors.forEach((fl, i) => {
    const line = (fill) => ('.'.repeat(fl.o) + fill + '.'.repeat(WIDTH)).slice(0, WIDTH);
    // Cada andar entra acima dos anteriores (linhas de cima para baixo: laje e 4 de parede)
    rows.unshift(...[
      line('D'.repeat(fl.w)),                                         // laje
      ...[0, 1, 2, 3].map(r => {
        let wall = '';
        for (let x = 0; x < fl.w; x++) {
          const brick = fl.wall === 'f' && (x + r * 2) % 4 === 0 ? 'F' : fl.wall;
          const win = x > 1 && x < fl.w - 2 && x % 5 < 2 && (r === 1 || r === 2);
          const door = i === 0 && x >= 2 && x <= 3 && r >= 1;
          wall += door ? 'K' : win ? ((x * 7 + r + seed + i) % 3 ? 'J' : 'O') : brick;
        }
        return line(wall);
      }),
    ]);
  });
  // Caixa d'água no andar de cima
  const top = floors[floors.length - 1], tx = top.o + 1 + rnd(Math.max(1, top.w - 6));
  const tank = r => ('.'.repeat(tx) + r + '.'.repeat(WIDTH)).slice(0, WIDTH);
  rows.unshift(tank('.xxxx.'), tank('xxxxxx'), tank('xxxxxx'), tank('.PPPP.'));
  return rows;
}

const PROPS = {
  arvore: { half: TREE_HALF },
  ipe: { half: TREE_HALF, pal: { G: [240, 196, 30], H: [190, 140, 10], E: [255, 236, 130] } },
  ipeRoxo: { half: TREE_HALF, pal: { G: [190, 90, 170], H: [130, 50, 120], E: [235, 160, 220] } },
  araucaria: {
    half: [
      '..HHHGGGGG', 'HHGGGGEGGG', '.HHHHGGGGG', '......HHMN', '........MN', '....HHGGMN', '..HHH...MN',
      '........MN', '........MN', '........MN', '........MN', '........MN', '........MN', '........MN',
      '.......MMN',
    ],
    size: 1.3,
  },
  coqueiro: {
    rows: [
      '...GG....HH.....', '..G..GG.H..HH...', '.G....GGHH...H..', 'G....HGGGGH...H.',
      '....H..GGE.G....', '...H..MNNM..G...', '.......NM.......', '.......NM.......',
      '........NM......', '........NM......', '........NM......', '........NM......',
      '.........NM.....', '.........NM.....', '.........NM.....', '.........NM.....',
      '........MNNM....',
    ],
    anchor: 10, size: 1.3,
  },
  // Poste de luz: haste do lado de fora, braço e lâmpada sobre a pista
  poste: {
    rows: ['.QPPPPPPPPQ', '.PQ.....LLL', '.PQ......L.', ...Array(20).fill('.PQ........'), 'QPPQ.......'],
    anchor: 2, size: 1.2,
  },
  placa: {
    rows: [
      'VVVVVVVVVVVVVVVV', 'VSSSSSSSSSSSSSSV', 'VSSWSWSWSSSWSSSV', 'VSSWWSSWWSWWSSSV',
      'VSSWSSSWSWSWSSSV', 'VSSWWSSWSSSWSSSV', 'VSSWSWSWSSSWSSSV', 'VSSSSSSSSSSSSSSV',
      'VVVVVVVVVVVVVVVV', ...Array(6).fill('...QP......QP...'),
    ],
  },
  outdoor: { rows: BILLBOARD_ROWS, size: 1.3 },
  outdoorAzul: { rows: BILLBOARD_ROWS, pal: { R: [40, 90, 200], Y: [250, 250, 250], W: [245, 200, 40] }, size: 1.3 },
  casa: {
    rows: [
      '.......RRRRRR.......', '.....RRRRRRRRRR.....', '...RRRRRRRRRRRRRR...', '.RRRRRRRRRRRRRRRRRR.',
      'RRRRRRRRRRRRRRRRRRRR', '.VVVVVVVVVVVVVVVVVV.', '.VVOOVVVVVVVVVOOVVV.', '.VVOOVVVNNVVVVJJVVV.',
      '.VVVVVVVNNVVVVJJVVV.', '.VVVVVVVNNVVVVVVVVV.', '.DDDDDDDDDDDDDDDDDD.',
    ],
    size: 1.2,
  },
  casaMorro1: { rows: makeHillHouses(11), size: 1.4 },
  casaMorro2: { rows: makeHillHouses(29), size: 1.4 },
  casaMorro3: { rows: makeHillHouses(47), size: 1.4 },
  casaMorro4: { rows: makeHillHouses(83), size: 1.4 },
  // Poste com o emaranhado de fios e o transformador
  posteFios: {
    rows: [
      '.....PPP.....', 'KKKKKKPKKKKKK', '.K.K.KPK.K.K.', '..KKKKPKKKK..', '...KK.P.KK...',
      '.....BPB.....', '.....BPB.....', '.....KPK.....', ...Array(15).fill('......P......'), '.....QPQ.....',
    ],
    size: 1.3,
  },
  // Orelhão
  orelhao: {
    rows: [
      '..aaaaa..', '.aaaaaaa.', 'aaKKKKKaa', 'aaK...Kaa', 'aa.....aa', 'a.......a',
      '....P....', '....P....', '....P....', '...PPP...',
    ],
    size: 1.1,
  },
  predio1: { rows: makeBuilding(18, 40, 1), size: 1.6 },
  predio2: { rows: makeBuilding(22, 30, 2), pal: { B: [178, 150, 120], D: [120, 98, 78] }, size: 1.6 },
  predio3: { rows: makeBuilding(15, 46, 3), pal: { B: [110, 118, 128], D: [70, 76, 86] }, size: 1.6 },
};

const propCache = new Map();
function getProp(name, mode = 'normal', flip = false, color = '') {
  const key = `${name}|${mode}|${flip}|${color}`;
  let s = propCache.get(key);
  if (!s) {
    s = buildProp(name, mode, flip, color);
    propCache.set(key, s);
  }
  return s;
}

function buildProp(name, mode, flip, color) {
  const def = PROPS[name];
  let rows = def.rows || def.half.map(r => r + r.split('').reverse().join(''));
  const w = Math.max(...rows.map(r => r.length));
  rows = rows.map(r => r.padEnd(w, '.'));
  if (flip) rows = rows.map(r => r.split('').reverse().join(''));
  const cv = document.createElement('canvas');
  cv.width = w;
  cv.height = rows.length;
  const g = cv.getContext('2d');
  const pal = def.pal ? { ...PROP_PAL, ...def.pal } : PROP_PAL;
  const anchor = def.anchor !== undefined ? def.anchor : w / 2;
  cv.anchor = flip ? w - anchor : anchor;
  cv.size = def.size || 1;

  if (mode === 'snowcap') {
    g.fillStyle = 'rgb(246,249,255)';
    for (let x = 0; x < w; x++) {
      let y = 0;
      while (y < rows.length && rows[y][x] === '.') y++;
      if (y >= rows.length) continue;
      g.fillRect(x, y, 1, 1);
      if (y + 1 < rows.length && 'GHE'.includes(rows[y + 1][x])) g.fillRect(x, y + 1, 1, 1);
    }
    return cv;
  }

  let lx = 0, ly = 0, ln = 0;
  const solid = mode === 'solid' ? hexToRgb(color) : null;
  for (let y = 0; y < rows.length; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      let c = pal[ch];
      if (!c) continue;
      const light = PROP_NIGHT_LIGHT[ch];
      if (ch === 'L') { lx += x + 0.5; ly += y + 0.5; ln++; }
      if (solid) c = solid;
      else if (mode === 'night') c = light || mulRgb(c, 0.16);
      g.fillStyle = rgbStr(c);
      g.fillRect(x, y, 1, 1);
    }
  }
  cv.lamp = ln ? [lx / ln, ly / ln] : null;      // posição da lâmpada (postes)
  return cv;
}

/* Textura de brilho radial, desenhada com composição aditiva ('lighter'). */
function makeGlow(r, g, b) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 32;
  const c = cv.getContext('2d');
  const gr = c.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.2, `rgba(${r},${g},${b},0.55)`);
  gr.addColorStop(0.55, `rgba(${r},${g},${b},0.15)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = gr;
  c.fillRect(0, 0, 32, 32);
  return cv;
}
const GLOW_RED = makeGlow(255, 50, 35);
const GLOW_WARM = makeGlow(255, 225, 160);

</script>
<script>
/* ---- src/audio.js ---- */
'use strict';
/* Sons sintetizados com WebAudio. Só inicializa após um gesto do usuário. */

const Sound = {
  ac: null, master: null, eng: null, noise: null, muted: false,

  init() {
    if (this.ac) {
      if (this.ac.state === 'suspended') this.ac.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ac = this.ac = new AC();
      this.master = ac.createGain();
      this.master.gain.value = this.muted ? 0 : 1;
      this.master.connect(ac.destination);

      const o1 = ac.createOscillator(); o1.type = 'sawtooth';
      const o2 = ac.createOscillator(); o2.type = 'square';
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
      const g = ac.createGain(); g.gain.value = 0;
      o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
      o1.start(); o2.start();
      this.eng = { o1, o2, g };

      const len = (ac.sampleRate * 0.5) | 0;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;

      // Chiado contínuo da chuva (ruído agudo em loop, volume controlado por Sound.rain)
      const rs = ac.createBufferSource(); rs.buffer = buf; rs.loop = true;
      const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
      const rg = ac.createGain(); rg.gain.value = 0;
      rs.connect(hp); hp.connect(rg); rg.connect(this.master);
      rs.start();
      this.rainGain = rg;
    } catch (e) {
      this.ac = null;
    }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 1;
  },

  engine(ratio, pitch, on) {
    if (!this.eng) return;
    const t = this.ac.currentTime;
    const f = (38 + ratio * 95) * pitch;
    // Só reagenda quando algo muda de fato: evita acumular eventos de automação a cada frame
    if (on === this.eng.on && Math.abs(f - this.eng.f) < 0.5) return;
    this.eng.on = on;
    this.eng.f = f;
    for (const p of [this.eng.o1.frequency, this.eng.o2.frequency, this.eng.g.gain]) {
      if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
      else p.cancelScheduledValues(t);
    }
    this.eng.o1.frequency.setTargetAtTime(f, t, 0.05);
    this.eng.o2.frequency.setTargetAtTime(f * 0.5, t, 0.05);
    this.eng.g.gain.setTargetAtTime(on ? 0.05 : 0, t, 0.08);
  },

  crash() {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = this.noise;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 0.45);
  },

  rain(level) {
    if (!this.rainGain) return;
    const v = Math.round(level * 20) / 20;          // só reagenda quando muda de verdade
    if (v === this.rainLevel) return;
    this.rainLevel = v;
    this.rainGain.gain.setTargetAtTime(v * 0.05, this.ac.currentTime, 0.3);
  },

  thunder(delay = 0.5) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = this.noise; src.loop = true; src.playbackRate.value = 0.35;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + 1.9);
  },

  beep(freq, dur = 0.08, delay = 0, vol = 0.08) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },

  jingle() { [523, 659, 784, 1047].forEach((f, i) => this.beep(f, 0.14, i * 0.12)); },
  fail() { [392, 330, 262, 196].forEach((f, i) => this.beep(f, 0.22, i * 0.2)); },
};

<script>
/* ---- src/gamepad.js ---- */
'use strict';
/* Suporte a controle via Gamepad API, pensado para controles USB estilo Super Nintendo.
   Cada ação tem uma lista de "binds"; basta um estar ativo:
     { b: i }        botão i
     { a: i, s: ±1 } eixo i passando de 0.5 no sentido s (analógico ou direcional reportado como eixo)
     { h: i, d: dir } "hat" (direcional digital reportado como um único eixo; comum em genéricos no Windows) */

const PAD_ACTIONS = ['left', 'right', 'up', 'down', 'accel', 'brake', 'start', 'select', 'l', 'r'];
const PAD_LABELS = {
  left: 'ESQUERDA', right: 'DIREITA', up: 'CIMA', down: 'BAIXO',
  accel: 'ACELERAR (B)', brake: 'FREAR (Y)', start: 'START (PAUSA)', select: 'SELECT (VOLTAR)',
  l: 'L (META -)', r: 'R (META +)',
};

// Controles no padrão do navegador (Xbox, PlayStation, 8BitDo...). Botões na mesma posição física do SNES:
// 0 = baixo (B do SNES), 1 = direita (A), 2 = esquerda (Y), 3 = cima (X)
const PAD_STANDARD = {
  left: [{ b: 14 }, { a: 0, s: -1 }], right: [{ b: 15 }, { a: 0, s: 1 }],
  up: [{ b: 12 }, { a: 1, s: -1 }], down: [{ b: 13 }, { a: 1, s: 1 }],
  accel: [{ b: 0 }, { b: 1 }, { b: 7 }], brake: [{ b: 2 }, { b: 6 }],
  start: [{ b: 9 }], select: [{ b: 8 }], l: [{ b: 4 }], r: [{ b: 5 }],
};

// Genéricos USB estilo SNES (numeração mais comum): X=0 A=1 B=2 Y=3 L=4 R=5 Select=8 Start=9,
// direcional nos eixos 0/1 ou como "hat" no eixo 9
const PAD_GENERIC = {
  left: [{ a: 0, s: -1 }, { h: 9, d: 'left' }], right: [{ a: 0, s: 1 }, { h: 9, d: 'right' }],
  up: [{ a: 1, s: -1 }, { h: 9, d: 'up' }], down: [{ a: 1, s: 1 }, { h: 9, d: 'down' }],
  accel: [{ b: 2 }, { b: 1 }], brake: [{ b: 3 }],
  start: [{ b: 9 }], select: [{ b: 8 }], l: [{ b: 4 }], r: [{ b: 5 }],
};

// Hat: um eixo com 8 posições entre -1 e 1 (passos de 2/7); em repouso fica fora dessa faixa (~1.29)
const HAT_DIRS = [['up'], ['up', 'right'], ['right'], ['down', 'right'], ['down'], ['down', 'left'], ['left'], ['up', 'left']];
function hatDirs(v) {
  if (v === undefined || Math.abs(v) > 1.1) return [];
  return HAT_DIRS[Math.round((v + 1) * 3.5)] || [];
}

function readPad() {
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of list) if (gp && gp.connected) return gp;
  return null;
}
const btnDown = btn => !!btn && (btn.pressed || btn.value > 0.5);

const Pad = {
  id: null, act: {}, hatSeen: {}, custom: {}, cap: null,
  onChange: null,                   // chamado quando um controle conecta/desconecta

  loadCustom() {
    try { this.custom = JSON.parse(localStorage.getItem('enduro-br-pad')) || {}; } catch (e) { this.custom = {}; }
  },
  saveCustom() {
    try { localStorage.setItem('enduro-br-pad', JSON.stringify(this.custom)); } catch (e) { /* sem storage */ }
  },
  bindingsFor(gp) {
    return this.custom[gp.id] || (gp.mapping === 'standard' ? PAD_STANDARD : PAD_GENERIC);
  },
  hasCustom() { return !!(this.id && this.custom[this.id]); },
  resetCustom() {
    if (this.id) { delete this.custom[this.id]; this.saveCustom(); }
  },

  active(gp, b) {
    if (b.b !== undefined) return btnDown(gp.buttons[b.b]);
    if (b.a !== undefined) {
      const v = gp.axes[b.a];
      return v !== undefined && !this.hatSeen[b.a] && v * b.s > 0.5;
    }
    if (b.h !== undefined) return !!this.hatSeen[b.h] && hatDirs(gp.axes[b.h]).includes(b.d);
    return false;
  },

  // Lê o controle; atualiza Pad.act e devolve as ações recém-apertadas
  poll() {
    const gp = readPad();
    if (!gp) {
      if (this.id) { this.id = null; if (this.onChange) this.onChange(null); }
      this.act = {};
      return [];
    }
    if (gp.id !== this.id) {
      this.id = gp.id;
      this.hatSeen = {};
      if (this.onChange) this.onChange(gp);
    }
    gp.axes.forEach((v, i) => { if (Math.abs(v) > 1.1) this.hatSeen[i] = true; });
    const binds = this.bindingsFor(gp), act = {};
    for (const a of PAD_ACTIONS) act[a] = (binds[a] || []).some(b => this.active(gp, b));
    const pressed = PAD_ACTIONS.filter(a => act[a] && !this.act[a]);
    this.act = act;
    return pressed;
  },

  rumble(ms, strength) {
    const gp = readPad(), va = gp && gp.vibrationActuator;
    if (!va || !va.playEffect) return;
    try {
      va.playEffect('dual-rumble', { duration: ms, strongMagnitude: strength, weakMagnitude: strength * 0.6 })
        .catch(() => {});
    } catch (e) { /* controle sem vibração */ }
  },

  // ---- Configuração: pede cada ação em sequência e grava o botão/direção apertado ----
  startCapture() { this.cap = { step: 0, binds: {}, wait: true, rest: null }; },
  captureAction() { return this.cap ? PAD_ACTIONS[this.cap.step] : null; },

  // Devolve 'done' quando a última ação é gravada
  captureTick() {
    const cap = this.cap, gp = readPad();
    if (!cap || !gp) return null;
    const pressedBtn = gp.buttons.findIndex(btnDown);
    // Posição de repouso dos eixos (há gatilhos que descansam em -1)
    if (!cap.rest) {
      if (pressedBtn < 0) cap.rest = gp.axes.slice();
      return null;
    }
    const axisMoved = (v, i) => Math.abs(v - (cap.rest[i] || 0)) > 0.6 && Math.abs(v) > 0.5;
    if (cap.wait) {
      // Só aceita a próxima entrada depois que tudo for solto
      const idle = pressedBtn < 0 && gp.axes.every((v, i) => (this.hatSeen[i] ? !hatDirs(v).length : !axisMoved(v, i)));
      if (idle) cap.wait = false;
      return null;
    }
    const want = PAD_ACTIONS[cap.step];
    let bind = null;
    if (pressedBtn >= 0) {
      bind = { b: pressedBtn };
    } else {
      for (let i = 0; i < gp.axes.length && !bind; i++) {
        const v = gp.axes[i];
        if (this.hatSeen[i]) {
          const d = hatDirs(v);
          if (d.length) bind = { h: i, d: d.includes(want) ? want : d[0] };
        } else if (axisMoved(v, i)) {
          bind = { a: i, s: Math.sign(v - (cap.rest[i] || 0)) };
        }
      }
    }
    if (!bind) return null;
    cap.binds[want] = [bind];
    cap.step++;
    cap.wait = true;
    Sound.beep(620 + cap.step * 40, 0.07);
    if (cap.step < PAD_ACTIONS.length) return null;
    this.custom[gp.id] = cap.binds;
    this.saveCustom();
    this.cap = null;
    return 'done';
  },
};
Pad.loadCustom();

</script>

const RAIN_PHASE = {
  name: 'CHUVA', dur: 25, skyT: '#3a414c', skyM: '#555d69', skyB: '#737b86', g1: '#2f5a34', g2: '#2b532f', road: '#3e4146',
  e1: '#d8d8d8', e2: '#b03a3a', m1: '#3c4a4a', m2: '#56606a', cl: '#6a727c', cs: '#454c56',

};
const PHASES_RAIN = PHASES.map(p => (p.name === 'NEVE' ? RAIN_PHASE : p));

const COLOR_KEYS = ['skyT', 'skyM', 'skyB', 'g1', 'g2', 'road', 'e1', 'e2', 'm1', 'm2', 'cl', 'cs'];
const NUM_KEYS = ['night', 'fog', 'snow', 'mist', 'cloud', 'rain'];
const BLEND = 4;                    // transição padrão entre fases (s)
const DAY_LEN = PHASES.reduce((s, p) => s + p.dur, 0);
for (const ph of [...PHASES, RAIN_PHASE]) {
  ph.c = {};
  for (const k of COLOR_KEYS) ph.c[k] = hexToRgb(ph[k]);
  for (const k of NUM_KEYS) ph[k] = ph[k] || 0;
}

function getEnv(t, phases = PHASES) {
  t = ((t % DAY_LEN) + DAY_LEN) % DAY_LEN;
  let i = 0, acc = 0;
  while (t >= acc + phases[i].dur) acc += phases[i++].dur;
  const a = phases[i], b = phases[(i + 1) % phases.length];
  const blend = a.blend || BLEND;
  const k = Math.max(0, (t - acc - (a.dur - blend)) / blend);
  const env = { name: k > 0.5 ? b.name : a.name, rgb: {} };
  for (const key of COLOR_KEYS) env[key] = rgbStr(env.rgb[key] = lerpRgb(a.c[key], b.c[key], k));
  for (const key of NUM_KEYS) env[key] = a[key] + (b[key] - a[key]) * k;

  // Sol baixo: percorre a fase inteira (entardecer desce, amanhecer sobe)
  env.sun = null;
  if (a.sun) {
    const prog = (t - acc) / a.dur;
    env.sun = { x: a.sun.x * W, e: a.sun.e0 + (a.sun.e1 - a.sun.e0) * prog, a: 1 - k };
  } else if (b.sun && k > 0) {
    env.sun = { x: b.sun.x * W, e: b.sun.e0, a: k };
  }
  // Força da luz baixa (sombras, contraluz): máxima com o sol perto do horizonte
  env.low = env.sun ? env.sun.a * clamp(1.15 - Math.max(0, env.sun.e), 0, 1) * clamp((env.sun.e + 0.25) / 0.3, 0, 1) : 0;
  // Lanternas acesas só com o sol bem baixo (não no começo da manhã)
  env.lamps = env.sun ? env.low * clamp((0.45 - env.sun.e) / 0.3, 0, 1) : 0;
  env.lamps = Math.max(env.lamps, env.rain * 0.9);        // na chuva todo mundo anda de lanterna acesa
  return env;
}

const RIDGE_N = 512;
function makeRidge(base, amp, seed) {
  const a = [];
  for (let i = 0; i < RIDGE_N; i++) {
    const t = (i / RIDGE_N) * Math.PI * 2;
    const v = 0.5 * Math.sin(t * 3 + seed) + 0.3 * Math.sin(t * 7 + seed * 2) + 0.2 * Math.sin(t * 13 + seed * 3);
    a.push(Math.max(1, Math.round(base + amp * v)));
  }
  return a;
}

const G = {
